<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>3D Transform Demo</title>
  <style>
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background: #222;
    }

    .card {
      width: 200px;
      height: 300px;
      perspective: 1000px; /* depth effect */
    }

    .inner {
      width: 100%;
      height: 100%;
      position: relative;
      transform-style: preserve-3d;
      animation: flip 4s cubic-bezier(0.42, 0, 0.58, 1) infinite alternate;
    }

    .front, .back {
      position: absolute;
      width: 100%;
      height: 100%;
      backface-visibility: hidden;
      border-radius: 10px;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 24px;
      color: white;
    }

    .front {
      background: crimson;
    }

    .back {
      background: teal;
      transform: rotateY(180deg);
    }

    @keyframes flip {
      from { transform: rotateY(0); }
      to   { transform: rotateY(180deg); }
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="inner">
      <div class="front">Front</div>
      <div class="back">Back</div>
    </div>
  </div>
</body>
</html>
