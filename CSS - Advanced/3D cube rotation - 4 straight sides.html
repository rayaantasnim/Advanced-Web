<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>3D Cube Rotation Refined</title>
  <style>
    body {
      display: flex;
      flex-direction: column; /* heading + cube vertically stacked */
      justify-content: center;
      align-items: center;
      height: 100vh;
      background: #111;
      color: #fff;
    }

    h1 {
      font-size: 28px;
      font-weight: bold;
      margin-bottom: 20px;
      text-align: center;
      color: #FFD700; /* golden heading */
      text-shadow: 2px 2px 6px rgba(0,0,0,0.6);
    }

    .scene {
      width: 200px;
      height: 200px;
      perspective: 800px; /* depth effect */
    }

    .cube {
      width: 100%;
      height: 100%;
      position: relative;
      transform-style: preserve-3d;
      animation: rotateCube 6s infinite linear;
    }

    .face {
      position: absolute;
      width: 200px;
      height: 200px;
      text-align: center !important;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 22px;
      font-weight: bold;
      color: white;
      background: rgba(0,0,0,0.8); /* solid background */
      border: 2px solid #fff;
    }

    .front  { background: crimson;  transform: rotateY(0deg) translateZ(100px); }
    .back   { background: teal;     transform: rotateY(180deg) translateZ(100px); }
    .right  { background: purple;   transform: rotateY(90deg) translateZ(100px); }
    .left   { background: orange;   transform: rotateY(-90deg) translateZ(100px); }

    @keyframes rotateCube {
      from { transform: rotateY(0deg); }
      to   { transform: rotateY(360deg); }
    }
  </style>
</head>
<body>
  <!-- Heading added here -->
  <h1>IDAI Universe: Cosmic Covenant</h1><br><br>

  <div class="scene">
    <div class="cube">
      <div class="face front">Your All in One Platform</div>
      <div class="face back">One Universe of Infinite Intelligence</div>
      <div class="face right">Powering the next civilization</div>
      <div class="face left">Legacy with innovation</div>
    </div>
  </div>
</body>
</html>
