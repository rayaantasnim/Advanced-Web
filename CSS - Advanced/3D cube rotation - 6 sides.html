<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>3D Cube Rotation Refined</title>
  <style>
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background: #111;
    }

    .scene {
      width: 200px;
      height: 200px;
      perspective: 800px; /* depth effect */
    }

    .cube {
      width: 100%;
      height: 100%;
      position: relative;
      transform-style: preserve-3d;
      animation: rotateCube 10s infinite linear;
    }

    .face {
      position: absolute;
      width: 200px;
      height: 200px;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 20px;
      font-weight: bold;
      color: white;
      background: #333; /* solid background */
      border: 2px solid #fff;
      backface-visibility: hidden; /* text always straight */
    }

    .front  { background: crimson;  transform: rotateY(0deg) translateZ(100px); }
    .back   { background: teal;     transform: rotateY(180deg) translateZ(100px); }
    .right  { background: purple;   transform: rotateY(90deg) translateZ(100px); }
    .left   { background: orange;   transform: rotateY(-90deg) translateZ(100px); }
    .top    { background: green;    transform: rotateX(90deg) translateZ(100px); }
    .bottom { background: blue;     transform: rotateX(-90deg) translateZ(100px); }

    @keyframes rotateCube {
      from { transform: rotateX(0deg) rotateY(0deg); }
      to   { transform: rotateX(360deg) rotateY(360deg); }
    }
  </style>
</head>
<body>
  <div class="scene">
    <div class="cube">
      <div class="face front">Your All in One Platform</div>
      <div class="face back">One Universe of Infinite Intelligence</div>
      <div class="face right">Powering the Next Civilization</div>
      <div class="face left">Legacy with Innovation</div>
      <div class="face top">Global Recognition for Discovery</div>
      <div class="face bottom">Beyond Every Limitation</div>
    </div>
  </div>
</body>
</html>
