<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Keyframes Grand Demo</title>
  <style>
    /* Fade In */
    @keyframes fadeIn {
      from { opacity: 0; }
      to   { opacity: 1; }
    }

    .fade {
      animation: fadeIn 3s ease-in forwards;
    }

    /* Fade Out */
    @keyframes fadeOut {
      from { opacity: 1; }
      to   { opacity: 0; }
    }

    .fade-out {
      animation: fadeOut 3s ease-out forwards;
    }

    /* Move (Translate) */
    @keyframes moveBox {
      0%   { transform: translateX(0); }
      50%  { transform: translateX(600px); }
      100% { transform: translateX(0); }
    }

    .move {
      animation: moveBox 4s infinite alternate;
    }

    /* Rotate */
    @keyframes rotateBox {
      from { transform: rotate(0deg); }
      to   { transform: rotate(360deg); }
    }

    .rotate {
      animation: rotateBox 5s linear infinite;
    }

    /* Scale (Zoom) */
    @keyframes zoomInOut {
      0%   { transform: scale(1); }
      50%  { transform: scale(1.5); }
      100% { transform: scale(1); }
    }

    .zoom {
      animation: zoomInOut 3s ease-in-out infinite;
    }

    /* Color Change */
    @keyframes colorChange {
      0%   { background-color: red; }
      25%  { background-color: orange; }
      50%  { background-color: yellow; }
      75%  { background-color: green; }
      100% { background-color: blue; }
    }

    .color {
      animation: colorChange 6s infinite alternate;
    }

    /* Bounce */
    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50%      { transform: translateY(-50px); }
    }

    .bounce {
      animation: bounce 2s infinite;
    }

    /* Gradient Background Animation */
    @keyframes gradientBg {
      0%   { background-position: 0% 50%; }
      50%  { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .gradient {
      background: linear-gradient(270deg, #ff0000, #00ff00, #0000ff);
      background-size: 600% 600%;
      animation: gradientBg 10s ease infinite;
      color: white;
      padding: 20px;
      text-align: center;
    }

    /* Text Typing Effect */
    @keyframes typing {
      from { width: 0; }
      to   { width: 100%; }
    }

    @keyframes blink {
      50% { border-color: transparent; }
    }

    .typing {
      overflow: hidden;
      white-space: nowrap;
      border-right: 3px solid black;
      width: 0;
      animation: typing 4s steps(30, end) forwards, blink 0.7s infinite;
    }

    /* Common Box Style */
    .box {
      width: 150px;
      height: 150px;
      margin: 20px;
      display: inline-block;
      text-align: center;
      line-height: 150px;
      color: white;
      font-weight: bold;
      border-radius: 10px;
    }

    .fade, .fade-out, .move, .rotate, .zoom, .color, .bounce {
      background: #FF8C00;
    }
  </style>
</head>
<body>
  <h1 style="text-align:center;">CSS Keyframes Grand Demo</h1>

  <div class="box fade">Fade In</div>
  <div class="box fade-out">Fade Out</div>
  <div class="box move">Move</div>
  <div class="box rotate">Rotate</div>
  <div class="box zoom">Zoom</div>
  <div class="box color">Color</div>
  <div class="box bounce">Bounce</div>

  <div class="gradient">Gradient Background Animation</div>

  <h2 class="typing">Typing Effect Demo...</h2>
</body>
</html>
