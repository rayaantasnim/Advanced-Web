<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Responsive Animation Demo</title>
  <style>
    body {
      overflow-x: hidden; /* prevent horizontal scroll */
    }

    @keyframes moveAcross {
      from { transform: translateX(0); }
      to   { transform: translateX(calc(100vw - 120px)); }
    }

    .box {
      width: 120px;
      height: 120px;
      background: #FF4500;
      color: white;
      font-weight: bold;
      text-align: center;
      line-height: 120px;
      border-radius: 10px;
      margin: 20px;
      animation: moveAcross 6s ease-in-out infinite alternate;
    }

    /* Mobile (≤600px) */
    @media (max-width: 600px) {
      .box {
        animation: moveAcross 10s ease-in-out infinite alternate; /* slower */
        background: teal; /* color change for clarity */
      }
    }

    /* Tablet (601px–1024px) */
    @media (min-width: 601px) and (max-width: 1024px) {
      .box {
        animation: moveAcross 1s cubic-bezier(0.42, 0, 0.68, 1) infinite alternate; 
        background: purple;
      }
    }

    /* Desktop (≥1025px) */
    @media (min-width: 1025px) {
      .box {
        animation: moveAcross 6s cubic-bezier(0.68, -0.55, 0.27, 1.55) infinite alternate; /* spring effect */
        background: crimson;
      }
    }
  </style>
</head>
<body>
  <h1 style="text-align:center;">Responsive Animation with Media Queries</h1>
  <div class="box">Motion</div>
</body>
</html>
