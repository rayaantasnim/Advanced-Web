<form>
  <label for="username">Username:</label>
  <input type="text" id="username" name="username" required minlength="4" maxlength="12">
  
  <label for="phone">Phone:</label>
  <input type="tel" id="phone" name="phone" pattern="[0-9]{11}" placeholder="11 digit number">
  
  <button type="submit">Submit</button>
</form>

<form>
  <label for="resume">Upload Resume:</label>
  <input type="file" id="resume" name="resume" accept=".pdf,.doc,.docx">
</form>

<form>
  <fieldset>
    <legend>Personal Information</legend>
    <label for="name">Name:</label>
    <input type="text" id="name" name="name" required>
    
    <label for="email">Email:</label>
    <input type="email" id="email" name="email" required>
  </fieldset>
  
  <fieldset>
    <legend>Preferences</legend>
    <label><input type="checkbox" name="subscribe"> Subscribe to newsletter</label>
  </fieldset>
  
  <button type="submit">Submit</button>
</form>


<input type="hidden" name="userID" value="12345">
